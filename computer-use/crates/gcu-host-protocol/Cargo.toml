[package]
name = "gcu-host-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = ["tokio/process"]

[dependencies]
gcu-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
interprocess = { version = "2.4", features = ["tokio"] }
hmac = "0.13"
sha2.workspace = true
rand = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Console"] }

[lints]
workspace = true
