[package]
name = "gcu-overlay"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "native_desktop"
harness = false

[dev-dependencies]
gcu-core.workspace = true
tokio.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gcu-driver-macos.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gcu-driver-windows.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
gcu-driver-linux.workspace = true

[dependencies]
gcu-protocol.workspace = true
gcu-host-api.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "xinput", "randr", "render"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls",
    "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSPanel", "NSWindow", "NSView", "NSResponder",
    "NSEvent", "NSScreen", "NSGraphics", "NSColor", "NSFont", "NSStringDrawing", "NSBezierPath",
    "NSAttributedString", "objc2-core-foundation", "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[lints]
workspace = true
