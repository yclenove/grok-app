[package]
name = "gcu-driver-macos"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["macos-private-spi"]
# SkyLight symbols are resolved with dlsym. Missing symbols degrade the
# capability table. They are not a Chromium background-click path (ADR 0006).
macos-private-spi = []

[dependencies]
gcu-protocol.workspace = true
gcu-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
smallvec.workspace = true
futures-core.workspace = true
tracing = "0.1"
png.workspace = true
unicode-segmentation = "1.13"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "0.2.0", default-features = false }
block2 = "0.6.2"
core-foundation = "0.10"
libc = "0.2"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    "NSPasteboardItem",
    "block2",
    "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "objc2",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGImage",
    "CGRemoteOperation",
    "CGWindow",
    "bitflags",
    "objc2",
    "libc",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "MDItem",
    "MDQuery",
    "Metadata",
    "objc2",
    "libc",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
security-framework = "3.7.0"
security-framework-sys = "2.17"
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
