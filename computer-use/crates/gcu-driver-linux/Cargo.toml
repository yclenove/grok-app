[package]
name = "gcu-driver-linux"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rand = "0.10"
gcu-protocol = { workspace = true }
gcu-core = { workspace = true }
atspi = { version = "0.30", features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "io-util"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
smol_str = { workspace = true }
smallvec = { workspace = true }
sha2.workspace = true
futures-core = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
x11rb = { version = "0.13", features = ["composite", "xtest", "xinput"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = "0.9"
reis = { version = "0.7", features = ["tokio"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop", "global_shortcuts"] }
pipewire = { version = "0.9", default-features = false, optional = true }

[features]
default = []
pipewire = ["ashpd/pipewire", "dep:pipewire"]

[dev-dependencies]
gcu-host-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
unicode-segmentation = "1"
tempfile = "3"

[lints]
workspace = true
