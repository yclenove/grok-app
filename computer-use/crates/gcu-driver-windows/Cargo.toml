[package]
name = "gcu-driver-windows"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gcu-protocol.workspace = true
gcu-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
    "Win32_Security", "Win32_Security_WinTrust",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop", "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_Packaging_Appx", "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
] }

[lints]
workspace = true
