[package]
name = "gcu-driver-windows"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-worker-faults = ["tokio/io-std"]

[[bin]]
name = "gcu-test-worker"
path = "tests/worker_support/fault_bin.rs"
required-features = ["test-worker-faults"]

[dependencies]
gcu-protocol.workspace = true
gcu-core.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-core.workspace = true
png.workspace = true
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows-core = { version = "0.62", default-features = false }
windows = { version = "0.62", default-features = false, features = [
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization",
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_Security", "Win32_Security_WinTrust",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop", "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Accessibility",
    "Win32_System_Variant", "Win32_System_Ole",
    "Win32_Storage_Packaging_Appx", "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps",
] }

[dev-dependencies]
insta = { version = "1", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
