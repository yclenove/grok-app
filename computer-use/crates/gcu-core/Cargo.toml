[package]
name = "gcu-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gcu-protocol.workspace = true
gcu-host-api.workspace = true

async-trait.workspace = true
bitflags.workspace = true
smol_str.workspace = true
smallvec.workspace = true
tokio.workspace = true
futures-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
toml.workspace = true
unicode-normalization = "0.1.24"

[lints]
workspace = true

[features]
testing = ["gcu-host-api/testing"]

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
insta = { version = "1.49", default-features = false }
criterion = { version = "0.8", default-features = false }
gcu-driver-fake.workspace = true
gcu-protocol.workspace = true
gcu-host-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
async-trait.workspace = true

[[bench]]
name = "render"
harness = false
