[package]
name = "gcu-eval"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline evaluation runner for computer-use tasks"
default-run = "gcu-eval"

[lib]
name = "gcu_eval"
path = "src/lib.rs"

[[bin]]
name = "gcu-eval"
path = "src/main.rs"

[[bin]]
name = "eval-fake-agent"
path = "src/bin/fake_agent.rs"

[[bin]]
name = "eval-fake-gcu"
path = "src/bin/fake_gcu.rs"

[features]
# Debug-only automatic CU approval. Release builds refuse GCU_APPROVAL=auto-*.
eval-autoapprove = []

[dependencies]
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
gcu-core.workspace = true
gcu-driver-fake.workspace = true
gcu-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tracing = "0.1"

[lints]
workspace = true
