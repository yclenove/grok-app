[package]
name = "gcu-script"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["script"]
# Marker for dependents. The engine stays linked with or without this flag.
script = []

[dependencies]
gcu-protocol.workspace = true
gcu-core.workspace = true
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[dev-dependencies]
gcu-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
