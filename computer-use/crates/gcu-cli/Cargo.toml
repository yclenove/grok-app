[package]
name = "gcu-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gcu"
path = "src/main.rs"

[features]
eval-autoapprove = []
# Delivery switches for later platform cards. Default off. Enabling one does
# not assemble a driver, fall back to fake, widen input, or elevate.
native-windows = []
native-x11 = []
native-wayland = []
# Darwin cc is required to compile this (objc2-exception-helper). Linux cross
# builds leave it off. macOS CI must pass `--features macos-webview`.
# Do not enable wry's `os-webview` feature: that pulls WebKitGTK.
macos-webview = ["dep:tao", "dep:wry"]
script = ["gcu-mcp/script", "dep:gcu-script"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
async-trait.workspace = true
clap = { version = "4.6", features = ["derive"] }
gcu-core.workspace = true
gcu-driver-fake.workspace = true
gcu-driver-macos.workspace = true
gcu-driver-windows.workspace = true
gcu-host-api.workspace = true
gcu-host-protocol.workspace = true
gcu-mcp.workspace = true
gcu-protocol.workspace = true
gcu-script = { workspace = true, optional = true }
rand = "0.10"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde.workspace = true
sha2.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "io-std", "net", "signal", "process"] }
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
toml_edit = "0.25"

[dev-dependencies]
gcu-host-api = { workspace = true, features = ["testing"] }
gcu-host-protocol = { workspace = true, features = ["testing"] }
assert_cmd = "2"
libc = "0.2"
insta = { version = "1.49", default-features = false }
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time", "io-util", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"
# WKWebView is target-gated inside wry. `os-webview` would pull WebKitGTK,
# which this Linux build host cannot provide. Do not enable that feature.
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }
wry = { version = "0.57", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry"] }

[lints]
workspace = true
