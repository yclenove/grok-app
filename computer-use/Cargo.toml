[workspace]
resolver = "2"
members = [
    "crates/gcu-protocol",
    "crates/gcu-host-api",
    "crates/gcu-host-protocol",
    "crates/gcu-core",
    "crates/gcu-driver-macos",
    "crates/gcu-driver-windows",
    "crates/gcu-driver-linux",
    "crates/gcu-driver-fake",
    "crates/gcu-script",
    "crates/gcu-mcp",
    "crates/gcu-overlay",
    "crates/gcu-cli",
    "crates/gcu-eval",
    "apps/fixture",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
sha2 = "0.11"
gcu-protocol = { path = "crates/gcu-protocol" }
gcu-host-api = { path = "crates/gcu-host-api" }
gcu-host-protocol = { path = "crates/gcu-host-protocol" }
gcu-core = { path = "crates/gcu-core" }
gcu-driver-macos = { path = "crates/gcu-driver-macos" }
gcu-driver-windows = { path = "crates/gcu-driver-windows" }
gcu-driver-linux = { path = "crates/gcu-driver-linux" }
gcu-driver-fake = { path = "crates/gcu-driver-fake" }
gcu-script = { path = "crates/gcu-script" }
gcu-mcp = { path = "crates/gcu-mcp" }
gcu-overlay = { path = "crates/gcu-overlay" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
toml = "1"
async-trait = "0.1"
bitflags = { version = "2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures-core = "0.3"
ron = "0.12"
png = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# PNG encode/decode and deflate are pathologically slow unoptimized. Optimizing only these leaf
# dependencies in dev/test keeps compile times and debuggability of our own crates while the
# redacted-image pipeline (and its 5s file/image ceiling) behaves like release on slow hosts.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3

# The redacted-image reduction loop (resize + PNG re-encode until under the byte budget) lives in
# gcu-core and is per-pixel; unoptimized it exceeds the product's 5s file/image ceiling on slower
# hosts. Optimize only this crate in dev/test; its code stays debuggable via debug info.
[profile.dev.package.gcu-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
