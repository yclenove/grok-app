[alias]
xtask = "run -p xtask --"

# Debug builds of the async dispatch path use close to 2 MiB of stack on
# Windows (measured: the mcp_e2e call test needs about 1.9 MiB on the base
# branch and a little more with computer_script). Rust test threads default to
# 2 MiB, so a small change tips them over. Give test threads headroom. Product
# binaries do not run on these threads: gcu.exe links an 8 MiB main stack and
# drives a current-thread runtime on it.
[env]
RUST_MIN_STACK = "8388608"
