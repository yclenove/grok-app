# Check all dependency targets, including other operating systems and features.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Vulnerabilities are errors by default in cargo-deny >= 0.18.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # RUSTSEC-2026-0192: ttf-parser is unmaintained upstream; transitive dependency of eframe 0.36
    "RUSTSEC-2026-0192",
]

[licenses]
# Everything outside this allowlist is rejected, including GPL/AGPL/LGPL.
# MPL-2.0 dependencies must remain dynamically linked (architecture §2).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.95
exceptions = [
    # Architecture §2 permits BSD-family licenses. These interprocess 2.4
    # transitives use the zero-clause BSD variant; no global license expansion.
    { allow = ["0BSD"], crate = "doctest-file" },
    { allow = ["0BSD"], crate = "recvmsg" },
    # Transitive dependencies of eframe 0.36 for gcu-fixture:
    # clipboard-win: transitive dependency via arboard on Windows
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    # error-code: transitive dependency via clipboard-win on Windows
    { allow = ["BSL-1.0"], crate = "error-code" },
    # epaint_default_fonts: embedded fonts in epaint for eframe UI rendering
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
    # ashpd 0.13 pipewire feature introduces target-lexicon 0.13.5 via cfg-expr / system-deps;
    # uses Apache-2.0 WITH LLVM-exception. Approved via ADR 0007 Option A; no global license expansion.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]

# proptest is dev-only, with std and no fork/timeout subprocess features.
# Its MIT/Apache-2.0 dependencies use the existing license allowlist.
# gcu-overlay dynamically loads distribution-owned Cairo/Pango/GLib on X11.
# Their LGPL/MPL system shared libraries are not statically linked or bundled;
# see crates/gcu-overlay/README.md for SONAMEs, licensing and failure behavior.
[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip-tree = [
    # eframe 0.36 brings in winit, wgpu, arboard which have transitive multiple versions across OS targets
    { crate = "eframe", reason = "fixture app eframe transitive dependencies" },
    # ashpd 0.13 pipewire build-time bindgen introduces cexpr -> nom 7.1.3 alongside libspa -> nom 8.0.0
    # Approved via ADR 0007 Option A; restricted precisely to bindgen build-time dependency.
    { crate = "bindgen", reason = "pipewire-sys/libspa-sys build-time bindgen dependency brings in nom 7" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
