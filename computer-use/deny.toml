# Check all dependency targets, including other operating systems and features.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Vulnerabilities are errors by default in cargo-deny >= 0.18.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # RUSTSEC-2026-0192: ttf-parser is unmaintained upstream; transitive dependency of eframe 0.36
    "RUSTSEC-2026-0192",
]

[licenses]
# Everything outside this allowlist is rejected, including GPL/AGPL/LGPL.
# MPL-2.0 dependencies must remain dynamically linked (architecture §2).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.95
exceptions = [
    # Transitive dependencies of eframe 0.36 for gcu-fixture:
    # clipboard-win: transitive dependency via arboard on Windows
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    # error-code: transitive dependency via clipboard-win on Windows
    { allow = ["BSL-1.0"], crate = "error-code" },
    # epaint_default_fonts: embedded fonts in epaint for eframe UI rendering
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

# proptest is dev-only, with std and no fork/timeout subprocess features.
# Its MIT/Apache-2.0 dependencies use the existing license allowlist.
[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip-tree = [
    # eframe 0.36 brings in winit, wgpu, arboard which have transitive multiple versions across OS targets
    { crate = "eframe", reason = "fixture app eframe transitive dependencies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
