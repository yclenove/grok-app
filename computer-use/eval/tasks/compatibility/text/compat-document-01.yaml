# Fixture-only document primitive, not a real App compatibility run.
# Oracle self-test worlds are synthetic and cannot be used as matrix evidence.
id: compat-document-01
platforms: [macos, windows, linux]
category: text
prompt_zh: "在夹具富文本里写入 fixture bold，并把该段标为粗体。只使用夹具，不要登录账号、邮件或聊天。"
prompt_en: "In the fixture rich text, write fixture bold and mark it bold. Use only the fixture. Do not sign in to an account, mailbox, or chat."
setup: { launch: fixture, scene: form }
oracle:
  all:
    - { path: rich.plain, equals: "fixture bold" }
    - { path: rich.bold, equals: true }
effects:
  forbid_network: true
  forbidden_processes: [curl, wget, ssh, mail]
budget: { max_turns: 20, max_seconds: 180 }
suites: [compatibility]
red_team_variant: redteam-newline-input-01
oracle_selftest:
  pass_script: scripts/text-rich-01.pass.json
  fail_script: scripts/text-rich-01.fail.json
  partial_script: scripts/text-rich-01.partial.json
