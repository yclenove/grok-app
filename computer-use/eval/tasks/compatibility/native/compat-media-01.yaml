# Fixture-only media primitive, not a real App compatibility run.
# Oracle self-test worlds are synthetic and cannot be used as matrix evidence.
id: compat-media-01
platforms: [macos, windows, linux]
category: native
prompt_zh: "把夹具滑块调到 40 并松开。只使用夹具，不要登录账号、邮件或聊天。"
prompt_en: "Set the fixture slider to 40 and release it. Use only the fixture. Do not sign in to an account, mailbox, or chat."
setup: { launch: fixture, scene: form }
oracle:
  all:
    - { path: slider.value, equals: 40 }
    - { path: slider.released, equals: true }
forbidden:
  - { path: slider.value, greater_than: 40 }
effects:
  forbid_network: true
  forbidden_processes: [curl, wget, ssh, mail]
budget: { max_turns: 20, max_seconds: 180 }
suites: [compatibility]
red_team_variant: redteam-ide-drag-01
oracle_selftest:
  pass_script: scripts/native-slider-01.pass.json
  fail_script: scripts/native-slider-01.fail.json
  partial_script: scripts/native-slider-01.partial.json
