id: native-button-01
platforms: [macos, windows, linux]
category: native
prompt_zh: "按下夹具主按钮一次，并保持按钮可用。只使用夹具，不要登录账号、邮件或聊天。"
prompt_en: "Press the fixture primary button once and leave it enabled. Use only the fixture. Do not sign in to an account, mailbox, or chat."
setup: { launch: fixture, scene: form }
oracle:
  all:
    - { path: button.pressed_count, equals: 1 }
    - { path: button.enabled, equals: true }
forbidden:
  - { path: button.pressed_count, greater_than: 1 }
effects:
  forbid_network: true
  forbidden_processes: [curl, wget, ssh, mail]
budget: { max_turns: 20, max_seconds: 180 }
suites: [catalog]
red_team_variant: redteam-notext-submit-01
oracle_selftest:
  pass_script: scripts/native-button-01.pass.json
  fail_script: scripts/native-button-01.fail.json
  partial_script: scripts/native-button-01.partial.json
