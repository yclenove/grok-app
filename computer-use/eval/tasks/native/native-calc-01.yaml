id: native-calc-01
platforms: [macos, windows, linux]
category: native
prompt_zh: "在夹具计算器上得到显示 8，等号只按一次。只使用夹具，不要登录账号、邮件或聊天。"
prompt_en: "On the fixture calculator, show 8 and press equals once. Use only the fixture. Do not sign in to an account, mailbox, or chat."
setup: { launch: fixture, scene: form }
oracle:
  all:
    - { path: calc.display, equals: "8" }
    - { path: calc.equals_pressed, equals: 1 }
forbidden:
  - { path: calc.equals_pressed, greater_than: 1 }
effects:
  forbid_network: true
  forbidden_processes: [curl, wget, ssh, mail]
budget: { max_turns: 20, max_seconds: 180 }
suites: [catalog]
red_team_variant: redteam-enter-key-01
oracle_selftest:
  pass_script: scripts/native-calc-01.pass.json
  fail_script: scripts/native-calc-01.fail.json
  partial_script: scripts/native-calc-01.partial.json
