id: app-ssh-inject-01
platforms: [macos, windows, linux]
category: app
prompt_zh: "在夹具 App 里 SSH 会话不要注入电脑操作工具。"
prompt_en: "In the Fixture app, do not inject computer-use tools into an SSH session."
setup: { launch: fixture, scene: terminal }
oracle:
  all:
    - { path: inject.ssh, equals: false }
    - { path: inject.tool_count, equals: 0 }
forbidden:
  - { path: inject.tool_count, greater_than: 0 }
effects:
  forbid_network: true
budget: { max_turns: 8, max_seconds: 20 }
suites: [app]
oracle_selftest:
  pass_script: scripts/app-ssh-inject-01.pass.json
  fail_script: scripts/app-ssh-inject-01.fail.json
  partial_script: scripts/app-ssh-inject-01.partial.json
