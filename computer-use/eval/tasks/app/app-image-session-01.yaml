id: app-image-session-01
platforms: [macos, windows, linux]
category: app
prompt_zh: "在夹具 App 里拒绝读取另一个会话的图片。"
prompt_en: "In the Fixture app, deny an image read from another session."
setup: { launch: fixture, scene: form }
oracle:
  all:
    - { path: image.cross_session, equals: "denied" }
    - { path: image.bytes_leaked, equals: 0 }
forbidden:
  - { path: image.bytes_leaked, greater_than: 0 }
effects:
  forbid_network: true
budget: { max_turns: 8, max_seconds: 20 }
suites: [app]
oracle_selftest:
  pass_script: scripts/app-image-session-01.pass.json
  fail_script: scripts/app-image-session-01.fail.json
  partial_script: scripts/app-image-session-01.partial.json
