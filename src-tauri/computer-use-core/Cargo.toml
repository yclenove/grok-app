[package]
name = "grok-computer-use-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
flate2 = "1.1"
base64 = "0.22"
png = "0.18"
tar = "0.4"
parking_lot = "0.12"
fs2 = "0.4"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = "0.8"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "computer-use-worker-fixture"
path = "tests/support/worker.rs"
required-features = ["test-support"]
test = false

[[bin]]
name = "cu-materialize-playwright"
path = "src/bin/materialize_playwright.rs"
test = false
bench = false

[[bin]]
name = "cu-pairing-fixture"
path = "tests/support/pairing_host.rs"
required-features = ["test-support"]
test = false
bench = false

[[bin]]
name = "cu-prepare-runtime"
path = "src/bin/prepare_runtime.rs"
test = false
bench = false

[[bin]]
name = "cu-macos-native"
path = "tests/support/macos_native_main.rs"
required-features = ["test-support"]
test = false
bench = false

[dev-dependencies]
http-body = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
