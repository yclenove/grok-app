[package]
name = "grok-computer-use-gtk-parent"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native-probe = ["grok-computer-use-core/test-support"]

[[bin]]
name = "cu-gtk-parent-native"
path = "src/main.rs"
required-features = ["native-probe"]
test = false
bench = false

[target.'cfg(target_os = "linux")'.dependencies]
grok-computer-use-core = { path = "../computer-use-core" }
gtk = { version = "0.18", features = ["v3_24"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
libc = "0.2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
