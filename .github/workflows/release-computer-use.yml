# Computer Use release: cu-v<semver> only. No PR-triggered signing/publication.
# Maintainers: configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_ISSUER, APPLE_API_KEY,
# APPLE_API_KEY_P8 together for Developer ID + notarytool. No empty secrets.
# WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD enable Authenticode.
# Missing certificates => ad-hoc macOS / unsigned Windows artifacts.
# NPM_TOKEN needs publish access to gcu and all @grok-computer-use platform packages;
# absent => npm artifacts only. GitHub Release uses scoped GITHUB_TOKEN on tag push.
# cosign keyless uses GitHub OIDC/Fulcio/Rekor only on tag publication; dispatch skips it.
# Homebrew/winget manifests are review artifacts: maintainers must own a tap/publisher
# account and submit them manually. No automatic external repository writes.
name: release-computer-use
on:
  push:
    tags: ['cu-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts only (manual dispatch never publishes)'
        type: boolean
        default: true
      tag:
        description: 'Version to validate, e.g. cu-v0.1.0 (empty uses workspace version)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-computer-use-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            npm: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            npm: darwin-x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            npm: win32-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            npm: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            npm: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: computer-use
        shell: bash
    env:
      GCU_TARGET: ${{ matrix.target }}
      GCU_NPM: ${{ matrix.npm }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve version and validate offline plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup target add "$GCU_TARGET"
          # No expression is interpolated into executable shell text.
          python3 packages/version.py
          cargo test --locked -p xtask
          cargo run --locked -q -p xtask -- release --dry-run --tag "$(cat target/release-tag)"
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          # Same PipeWire PPA handling as computer-use.yml: the stock jammy libpipewire is
          # too old for libspa. Retry the flaky PPA, then fail early with a clear message.
          sudo add-apt-repository -y -n ppa:pipewire-debian/pipewire-upstream
          for attempt in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=5 || true
            if apt-cache policy libpipewire-0.3-dev | grep -q 'ppa.launchpadcontent.net/pipewire-debian'; then
              break
            fi
            echo "pipewire-upstream PPA not usable (attempt $attempt); retrying"
            sleep 20
          done
          if ! apt-cache policy libpipewire-0.3-dev | grep -q 'ppa.launchpadcontent.net/pipewire-debian'; then
            echo "::error::pipewire-upstream PPA unavailable after retries; refusing to build against the stock libpipewire"
            exit 1
          fi
          for attempt in 1 2 3; do
            sudo apt-get install -y -o Acquire::Retries=6 libxkbcommon-dev libpipewire-0.3-dev rpm && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt install failed (attempt $attempt); retrying"
            sleep 30
          done
      - name: Install pinned release tools
        run: |
          cargo install --locked cargo-auditable --version 0.7.7
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: License, advisory and source gate
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: computer-use/Cargo.toml
      - name: Auditable native binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then extra=(--features macos-webview); fi
          if [[ "$RUNNER_OS" == Linux ]]; then extra=(--features gcu-driver-linux/pipewire); fi
          cargo auditable build --locked --release -p gcu-cli --target "$GCU_TARGET" "${extra[@]}"
          cargo run --locked -q -p xtask -- release --stage --tag "$(cat target/release-tag)" --target "$GCU_TARGET" --output target/cu-stage --repository "$RELEASE_REPOSITORY"
      - name: macOS Developer ID and notarization (optional)
        if: runner.os == 'macOS' && github.event_name == 'push' && inputs.dry_run != true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash packages/macos-sign.sh
      - name: Windows Authenticode (optional)
        if: runner.os == 'Windows' && github.event_name == 'push' && inputs.dry_run != true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packages/windows-sign.ps1
      - name: Per-platform CycloneDX dependency graph
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then extra=(--features macos-webview); fi
          cargo cyclonedx --format json --target "$GCU_TARGET" --manifest-path crates/gcu-cli/Cargo.toml "${extra[@]}"
          python3 packages/archive.py
      - name: Debian and RPM packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo install --locked cargo-deb --version 3.8.0
          cargo install --locked cargo-generate-rpm --version 0.21.0
          python3 packages/linux/prepare.py
          version="$(cat target/release-version)"
          cargo deb --no-build --no-strip -p gcu-cli --target "$GCU_TARGET" --output "target/cu-assets/gcu-$version-$GCU_TARGET.deb"
          # cargo-generate-rpm reads assets relative to the workspace root.
          cargo generate-rpm -p crates/gcu-cli --target "$GCU_TARGET" --output target/cu-rpm
          python3 packages/linux/finish.py
      - name: Upload staged packages (no publication)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cu-${{ matrix.target }}
          path: computer-use/target/cu-assets/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: computer-use
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cu-*
          path: computer-use/target/cu-assets
          merge-multiple: true
      - name: Version, manifests, npm archives and final checksums
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          python3 packages/version.py
          python3 -B packages/test_packages.py
          cargo run --locked -q -p xtask -- release --collect --tag "$(cat target/release-tag)" --repository "$RELEASE_REPOSITORY" --output target/cu-assets
          # npm pack runs no lifecycle scripts; no registry request is needed.
          for package in target/cu-assets/npm/launcher; do
            npm pack "$PWD/$package" --ignore-scripts --offline --pack-destination target/cu-assets
          done
          test -s "target/cu-assets/gcu-$(cat target/release-version).tgz"
          cargo run --locked -q -p xtask -- release --collect --tag "$(cat target/release-tag)" --repository "$RELEASE_REPOSITORY" --output target/cu-assets
          (cd target/cu-assets && sha256sum --check --strict SHA256SUMS)
      - name: Upload complete review artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: computer-use-release
          path: computer-use/target/cu-assets/
          if-no-files-found: error
          retention-days: 14

  # P9-03: a real tag release needs measured p50/p95 reports for every platform
  # in computer-use/bench/. No reports, too few samples or a missed budget fail
  # this job, so publication is blocked. Dry runs and branch CI do not run it.
  perf-gate:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cu-v') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: computer-use
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native performance budget gate
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cargo run --locked -q -p xtask -- bench-check

  publish:
    needs: [assemble, perf-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cu-v') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: computer-use-release
          path: assets
      - name: Verify release assets
        working-directory: assets
        run: sha256sum --check --strict SHA256SUMS
      - name: Install cosign at pinned version
        run: |
          # Go validates module checksums through sum.golang.org; no unpinned install script.
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
      - name: Keyless sign SHA256SUMS on tag publication
        run: '"$(go env GOPATH)/bin/cosign" sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS'
      - name: Publish npm packages when configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$NPM_TOKEN" ]]; then echo 'NPM_TOKEN absent: npm packages remain artifacts.'; exit 0; fi
          npmrc="$(mktemp "$RUNNER_TEMP/gcu-npm.XXXXXX")"
          trap 'rm -f "$npmrc"' EXIT
          chmod 600 "$npmrc"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc"
          export NPM_CONFIG_USERCONFIG="$npmrc"
          channel=latest
          [[ "${RELEASE_TAG#cu-v}" == *-* ]] && channel=next
          # Platforms first. Publish the exact hashed tarballs, never mutable directories.
          for package in assets/grok-computer-use-*.tgz assets/gcu-*.tgz; do
            npm publish "$package" --access public --provenance --ignore-scripts --tag "$channel"
          done
      - name: GitHub Release from version changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-for-release.py "${RELEASE_TAG#cu-v}" > "$RUNNER_TEMP/cu-release-notes.md"
          extra=()
          [[ "${RELEASE_TAG#cu-v}" == *-* ]] && extra=(--prerelease)
          # No latest desktop release displacement; Computer Use has a separate tag namespace.
          files=()
          for file in assets/*; do [[ -f "$file" ]] && files+=("$file"); done
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --draft --latest=false "${extra[@]}" --title "Computer Use ${RELEASE_TAG#cu-v}" --notes-file "$RUNNER_TEMP/cu-release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
