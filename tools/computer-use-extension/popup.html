<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Computer Use</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1 data-i18n="extensionName"></h1>
    <p class="muted" data-i18n="pairingHint"></p>
    <p id="identity" class="muted"></p>
    <form id="pair-form">
      <label><span data-i18n="appAddress"></span><input id="endpoint" type="text" required autocomplete="off" spellcheck="false"></label>
      <label><span data-i18n="pairingCode"></span><input id="code" type="password" required maxlength="40" autocomplete="off" spellcheck="false"></label>
      <button id="pair" type="submit" data-i18n="pair"></button>
    </form>
    <button id="forget" type="button" data-i18n="forget"></button>
    <div class="share-actions" role="toolbar">
      <button id="share-current" type="button" data-i18n="shareCurrentTab" disabled></button>
      <button id="unshare-current" type="button" data-i18n="unshareCurrentTab" disabled></button>
    </div>
    <p id="tab-title" class="muted"></p>
    <p id="tab-status" role="status" aria-live="polite"></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
